name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    name: Contracts (Build · Test · Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt

      - name: Pin transitive dependencies to working versions
        run: |
          cargo generate-lockfile
          cargo update -p ed25519-dalek --precise 2.1.1 || true
          cargo update -p ed25519 --precise 2.2.3 || true

      - name: Build WASM release
        run: cargo build --release --target wasm32v1-none

      - name: Run unit tests
        run: cargo test --all --features testutils

  circuits:
    name: Circuits (Structure Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify circuit files exist
        run: |
          test -f circuits/range_proof/range_proof.circom && echo "✓ range_proof.circom OK"
          test -f circuits/stream_nullifier/nullifier.circom && echo "✓ nullifier.circom OK"
