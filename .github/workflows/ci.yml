name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    name: Contracts (Build · Test · Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        continue-on-error: true

      - name: Build (native — for fast feedback)
        run: cargo build --all

      - name: Build (WASM release)
        run: cargo build --release --target wasm32v1-none

      - name: Run tests
        run: cargo test --all --features testutils

  circuits:
    name: Circuits (Structure Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify circuit files exist
        run: |
          test -f circuits/range_proof/range_proof.circom && echo "range_proof.circom OK"
          test -f circuits/stream_nullifier/nullifier.circom && echo "nullifier.circom OK"
